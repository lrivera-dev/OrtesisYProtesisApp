<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Ortesis&Protesis</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/acceso.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <script type="module" src="js/login.js"></script>
</head>

<body class="body-acceso">
    <header class="acceso-header">
        <a href="index.html" class="marca">Ortesis<span>&</span>Protesis</a>
        <a href="index.html" class="volver">← Volver al inicio</a>
    </header>

    <main class="acceso-main">
        <section class="auth-card">
            <div class="auth-header">
                <span class="etiqueta">Portal Ortesis&Protesis</span>
                <h1>Iniciar sesión</h1>
                <p>Ingresa para consultar tus solicitudes y su avance.</p>
            </div>

            <p id="authStatus" class="auth-status" role="status" aria-live="polite"></p>

            <form id="loginForm" class="auth-form">
                <div class="campo">
                    <label for="loginEmail">Correo electrónico</label>
                    <input type="email" id="loginEmail" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-primario">Iniciar sesión</button>
            </form>

            <p class="auth-link">
                ¿Aún no tienes cuenta? <a href="registro.html">Crear cuenta</a>
            </p>
        </section>
    </main>
</body>

</html>
