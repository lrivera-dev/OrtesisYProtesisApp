<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | OrtoVida</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/acceso.css">
    <script type="module" src="js/login.js"></script>
</head>

<body>
    <header class="acceso-header">
        <a href="index.html" class="marca">Ortesis&Protesis</a>
        <a href="index.html" class="volver">Volver al inicio</a>
    </header>

    <main class="acceso-main">
        <section class="auth-card">
            <span class="etiqueta">Portal Ortesis&Protesis</span>
            <h1>Iniciar sesión</h1>
            <p>Ingresa para consultar tus solicitudes y su avance.</p>

            <p id="authStatus" class="auth-status" role="status" aria-live="polite"></p>

            <form id="loginForm">
                <label for="loginEmail">Correo electrónico</label>
                <input type="email" id="loginEmail" autocomplete="email" required>

                <label for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" autocomplete="current-password" required>

                <button type="submit">Iniciar sesión</button>
            </form>

            <p class="auth-link">
                ¿Aún no tienes cuenta?
                <a href="registro.html">Crear cuenta</a>
            </p>
        </section>
    </main>
</body>

</html>
