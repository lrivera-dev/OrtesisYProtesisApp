<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | OrtoVida</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/acceso.css">
    <script type="module" src="js/registro.js"></script>
</head>

<body>
    <header class="acceso-header">
        <a href="index.html" class="marca">Ortesis&Protesis</a>
        <a href="index.html" class="volver">Volver al inicio</a>
    </header>

    <main class="acceso-main">
        <section class="auth-card">
            <span class="etiqueta">Portal Ortesis&Protesis</span>
            <h1>Crear cuenta</h1>
            <p>Regístrate para enviar solicitudes y consultar su avance.</p>

            <p id="authStatus" class="auth-status" role="status" aria-live="polite"></p>

            <form id="registerForm">
                <label for="registerNombre">Nombre</label>
                <input type="text" id="registerNombre" autocomplete="given-name" maxlength="60" required>

                <label for="registerApellido">Apellido</label>
                <input type="text" id="registerApellido" autocomplete="family-name" maxlength="60" required>

                <label for="registerEmail">Correo electrónico</label>
                <input type="email" id="registerEmail" autocomplete="email" required>

                <label for="registerPassword">Contraseña</label>
                <input type="password" id="registerPassword" autocomplete="new-password" minlength="6" required>

                <button type="submit">Crear cuenta</button>
            </form>

            <p class="auth-link">
                ¿Ya tienes cuenta?
                <a href="login.html">Iniciar sesión</a>
            </p>
        </section>
    </main>
</body>

</html>
